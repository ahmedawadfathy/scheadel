*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink);min-height:100vh}
.shell{width:min(1120px,calc(100% - 32px));margin:32px auto 54px}
.hero{border-radius:26px;padding:30px 34px;background:linear-gradient(120deg,#12354b,#0d6569);color:white;position:relative;overflow:hidden;box-shadow:0 14px 35px #153b4d20}
.hero:after{content:"";position:absolute;width:240px;height:240px;left:-55px;top:-110px;border-radius:50%;background:#ffffff10}.eyebrow{font-size:14px;color:#a8e5dc;font-weight:bold}.hero h1{font-size:clamp(25px,4vw,38px);margin:10px 0 7px}.hero p{margin:0;color:#d6e9ec;font-size:15px;line-height:1.7}
.panel{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:18px;box-shadow:0 6px 20px #183e5109}

.summary{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:17px;color:var(--muted);font-size:14px}.pill{display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;background:var(--teal-light);color:#08766f;font-weight:bold}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 2px 13px}.section-title h2{font-size:22px;margin:0}.section-title small{margin-right:auto;color:var(--muted);font-size:14px}
.today-card{border-radius:20px;border:1px solid #cfe9e4;background:linear-gradient(120deg,#f0fbf8,#fff);padding:22px;box-shadow:0 7px 20px #078c8310}.today-head{display:flex;align-items:center;gap:10px;margin-bottom:15px}.today-dot{width:11px;height:30px;border-radius:8px;background:var(--teal)}.today-head h3{font-size:21px;margin:0}.today-label{margin-right:auto;background:#d9f2ed;color:#06796f;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:bold}
.events{display:grid;gap:10px}.event{display:grid;grid-template-columns:145px 1fr;gap:15px;align-items:center;background:#fff;border:1px solid #e5eff0;border-radius:14px;padding:13px 15px}.time{direction:ltr;text-align:center;border-radius:10px;background:var(--teal-light);color:#08786f;font-size:15px;font-weight:bold;padding:10px 6px;white-space:nowrap}.subject{font-size:17px;font-weight:bold;line-height:1.5}.details{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}.empty{color:var(--muted);padding:12px 2px;font-size:16px}
